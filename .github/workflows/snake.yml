name: Refresh profile cards
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'fonts/**'
      - 'data/portrait.json'
      - '.github/workflows/snake.yml'
permissions:
  contents: write
concurrency:
  group: profile-cards
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check calculations
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Refresh public calendar and render SVG cards
        run: python scripts/render_readme_cards.py --refresh
      - name: Commit updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cards data/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh profile cards [skip ci]'
            git push
          fi
